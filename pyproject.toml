[project]
name = "autocad-mcp"
version = "0.3.0"
description = "MCP-сервер для AutoCAD любой версии (COM) и DXF без AutoCAD (ezdxf): черчение, планы, окна и двери по замерам. Для любых AI-помощников (stdio и HTTP)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "autocad", "dxf", "cad", "claude", "cursor", "ezdxf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=2.0",
    "ezdxf>=1.3",
    "matplotlib>=3.7",
    "pypdf>=4",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
autocad-mcp = "autocad_mcp.cli:run"

[project.urls]
Homepage = "https://github.com/nairaamiryanai-del/autocad-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autocad_mcp"]
